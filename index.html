<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Manajemen Aset Lazuardi</title>
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var _fetch = originalFetch ? originalFetch.bind(window) : null;
          Object.defineProperty(window, 'fetch', {
            get: function() { return _fetch; },
            set: function(val) { _fetch = val; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn('Fetch descriptor polyfill warning:', e);
        }

        window.onerror = function(msg) {
          if (typeof msg === 'string' && msg.indexOf('Cannot set property fetch') !== -1) {
            return true;
          }
        };

        window.addEventListener('error', function(e) {
          if (e && e.message && e.message.indexOf('Cannot set property fetch') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
